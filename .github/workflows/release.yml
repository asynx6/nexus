# Auto-publish @asynx6/nexus-cli to npm on tag v*.
# Bundles all @nexus/* workspace packages into apps/cli/vendor so the
# published tarball is self-contained (the workspace packages are private).
name: Publish @asynx6/nexus-cli
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - name: Bundle workspace deps into vendor/
        run: node scripts/bundle-cli.mjs
      - name: Publish to npm
        run: npm publish --access public
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Success
        if: success()
        run: echo "Published ${{ github.ref_name }}"